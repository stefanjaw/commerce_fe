<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="commerce_fe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>commerce_fe</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Initialize IndexedDB
    window.db = null;
    const dbName = "OrdersDB";
    const request = indexedDB.open(dbName, 1);

    request.onerror = (event) => {
      console.error("Database error:", event.target.error);
    };

    request.onupgradeneeded = (event) => {
      window.db = event.target.result;
      if (!window.db.objectStoreNames.contains('orders')) {
        window.db.createObjectStore('orders', { keyPath: 'timestamp' });
      }
    };

    request.onsuccess = (event) => {
      window.db = event.target.result;
    };

    // Store order function
    window.storeOrder = function(orderDataString) {
      if (!window.db) {
        console.error("Database not initialized");
        return;
      }
      try {
        const orderData = JSON.parse(orderDataString);
        const transaction = window.db.transaction(['orders'], 'readwrite');
        const store = transaction.objectStore('orders');
        store.put(orderData);
        console.log("Order stored successfully", orderData);
      } catch (e) {
        console.error("Error storing order:", e);
      }
    };

    window.showOrders = function() {
      if (!window.db) {
        console.error("Database not initialized");
        return;
      }

      const transaction = window.db.transaction(['orders'], 'readonly');
      const store = transaction.objectStore('orders');
      const request = store.getAll();

      request.onsuccess = () => {
        const orders = request.result;
        console.log('Orders from IndexedDB:', orders);

        // Create popup content
        let popupContent = '<div style="padding: 20px;">';
        popupContent += '<h2>Orders</h2>';
        if (orders.length === 0) {
          popupContent += '<p>No orders found</p>';
        } else {
          popupContent += '<ul style="list-style: none; padding: 0;">';
          orders.forEach(order => {
            popupContent += `<li style="margin-bottom: 10px; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
              ${JSON.stringify(order, null, 2)}
            </li>`;
          });
          popupContent += '</ul>';
        }
        popupContent += '</div>';

        // Create and show popup window
        const popup = window.open('', 'Orders', 'width=600,height=400,scrollbars=yes');
        popup.document.write(`
          <html>
            <head>
              <title>Orders</title>
              <style>
                body { font-family: Arial, sans-serif; }
                pre { white-space: pre-wrap; }
              </style>
            </head>
            <body>${popupContent}</body>
          </html>
        `);
      };

      request.onerror = (event) => {
        console.error('Error fetching orders:', event.target.error);
      };
    };
  </script>
</head>
<body>
  <style>
    #showOrdersBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px;
      background-color: #ff4444;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 1000;
      transition: transform 0.2s;
    }
    #showOrdersBtn:hover {
      transform: scale(1.1);
    }
    .emergency-icon {
      width: 24px;
      height: 24px;
      fill: white;
    }
  </style>
  <button id="showOrdersBtn" onclick="showOrders()" title="Show Orders">
    <svg class="emergency-icon" viewBox="0 0 24 24">
      <path d="M12 2L1 21h22L12 2zm0 3.45l8.27 14.32H3.73L12 5.45zm-1.5 8.5v4h3v-4h-3zm0-5v3h3v-3h-3z"/>
    </svg>
  </button>
  <script src="flutter_bootstrap.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
